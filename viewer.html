
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Просмотр документа</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #eeeeee;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    flex-shrink: 0;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
    background: #fff;
    border-bottom: 1px solid #ddd;
  }

  .toolbar button {
    min-width: 38px;
    height: 38px;
    padding: 0 10px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    color: #171717;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .toolbar button:disabled {
    opacity: .4;
    cursor: default;
  }

  #pageCounter,
  #zoomValue {
    font-size: 13px;
    white-space: nowrap;
  }

  #viewer {
    flex: 1;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  #pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: max-content;
    min-width: 100%;
    margin: 0 auto;
    padding: 14px;
  }

  .pdf-page {
    flex: none;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    color: #888;
    font-size: 13px;
    overflow: hidden;
  }

  .pdf-page canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #message {
    padding: 35px 15px;
    text-align: center;
    line-height: 1.5;
    color: #444;
  }

  #downloadPanel {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 25px;
    text-align: center;
  }

  #downloadLink {
    padding: 15px 28px;
    background: #0C3294;
    color: #fff;
    text-decoration: none;
    border-radius: 7px;
    font-weight: 600;
  }

  body.downloading .toolbar,
  body.downloading #viewer {
    display: none;
  }

  body.downloading #downloadPanel {
    display: flex;
  }

  @media (max-width: 640px) {
    .toolbar {
      gap: 7px;
      padding: 8px 5px;
    }

    .toolbar button {
      min-width: 34px;
      height: 36px;
      padding: 0 8px;
      font-size: 13px;
    }

    #pages {
      gap: 10px;
      padding: 8px;
    }
  }
</style>
</head>

<body>

<nav class="toolbar" aria-label="Управление документом">
  <span id="pageCounter">Стр. — / —</span>

  <button id="zoomOut" disabled aria-label="Уменьшить">
    −
  </button>

  <span id="zoomValue">100%</span>

  <button id="zoomIn" disabled aria-label="Увеличить">
    +
  </button>

  <button id="fitPage" disabled>
    По странице
  </button>
</nav>

<main id="viewer">
  <div id="message" role="status">
    Загружаем документ…
  </div>
  <div id="pages"></div>
</main>

<div id="downloadPanel">
  <h3 id="downloadStatus">Подготовка файла…</h3>

  <a id="downloadLink" href="#">
    Скачать файл
  </a>

  <p>
    Если скачивание не началось автоматически,
    нажмите кнопку выше.
  </p>
</div>

<script type="module">
  const params = new URLSearchParams(location.search);
  const file = params.get("file") || "";
  const downloadMode = params.get("download") === "1";

  // Разрешены только файлы из этого каталога
  const validFile =
    /^[a-zA-Z0-9._,-]+\.(pdf|xls)$/i.test(file) &&
    !file.includes("..");

  const fileUrl = validFile
    ? new URL(encodeURIComponent(file), location.href).href
    : "";

  const viewer = document.getElementById("viewer");
  const pagesContainer = document.getElementById("pages");
  const message = document.getElementById("message");
  const counter = document.getElementById("pageCounter");
  const zoomOut = document.getElementById("zoomOut");
  const zoomIn = document.getElementById("zoomIn");
  const fitButton = document.getElementById("fitPage");
  const zoomValue = document.getElementById("zoomValue");

  if (!validFile) {
    message.textContent = "Неверное имя файла.";
  } else if (downloadMode) {
    startDownload();
  } else if (!/\.pdf$/i.test(file)) {
    message.textContent = "Предпросмотр доступен только для PDF.";
  } else {
    startViewer();
  }

  // СКАЧИВАНИЕ ЧЕРЕЗ ТОТ ЖЕ ДОМЕН GITHUB
  async function startDownload() {
    document.body.classList.add("downloading");

    const status = document.getElementById("downloadStatus");
    const link = document.getElementById("downloadLink");

    try {
      const response = await fetch(fileUrl);

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);

      link.href = blobUrl;
      link.download = file;

      status.textContent = "Файл готов к скачиванию";
      link.click();

      window.addEventListener("pagehide", function () {
        URL.revokeObjectURL(blobUrl);
      }, { once: true });

    } catch (error) {
      status.textContent = "Не удалось подготовить скачивание";
      link.href = fileUrl;
      link.textContent = "Открыть файл";
      console.error(error);
    }
  }

  // ПРОСМОТР PDF
  async function startViewer() {
    try {
      const pdfjsLib = await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
      );

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

      const loadingTask = pdfjsLib.getDocument({
        url: fileUrl
      });

      const pdf = await loadingTask.promise;
      const firstPage = await pdf.getPage(1);
      const firstViewport = firstPage.getViewport({ scale: 1 });

      let zoom = 1;
      let generation = 0;
      let renderQueue = Promise.resolve();
      let activeRender = null;
      let scheduled = false;
      let resizeTimer;

      message.hidden = true;

      // Создаём места для всех страниц
      const items = [];

      for (let i = 1; i <= pdf.numPages; i++) {
        const element = document.createElement("section");
        element.className = "pdf-page";
        element.textContent = "Страница " + i;
        element.setAttribute("aria-label", "Страница " + i);

        pagesContainer.appendChild(element);

        items.push({
          number: i,
          element,
          width: firstViewport.width,
          height: firstViewport.height,
          queuedGeneration: -1,
          renderedGeneration: -1
        });
      }

      // Подгоняем каждую страницу и по ширине, и по высоте
      function getDimensions(item) {
        const maxWidth = Math.max(160, viewer.clientWidth - 32);
        const maxHeight = Math.max(180, viewer.clientHeight - 32);

        const fitScale = Math.min(
          maxWidth / item.width,
          maxHeight / item.height
        );

        const scale = fitScale * zoom;

        return {
          scale,
          width: item.width * scale,
          height: item.height * scale
        };
      }

      function setPageSize(item) {
        const dimensions = getDimensions(item);

        item.element.style.width =
          dimensions.width + "px";

        item.element.style.height =
          dimensions.height + "px";
      }

      function updateZoomControls() {
        zoomValue.textContent = Math.round(zoom * 100) + "%";
        zoomOut.disabled = zoom <= 0.6;
        zoomIn.disabled = zoom >= 2.4;
        fitButton.disabled = Math.abs(zoom - 1) < 0.01;
      }

      function isNearViewport(item) {
        const rect = item.element.getBoundingClientRect();
        const area = viewer.getBoundingClientRect();
        const margin = viewer.clientHeight;

        return rect.bottom >= area.top - margin &&
               rect.top <= area.bottom + margin;
      }

      // Отображаем только близкие к экрану страницы,
      // чтобы длинные PDF не занимали всю память телефона
      function renderPage(item) {
        if (
          item.renderedGeneration === generation ||
          item.queuedGeneration === generation
        ) return;

        const currentGeneration = generation;
        item.queuedGeneration = currentGeneration;

        renderQueue = renderQueue
          .catch(() => {})
          .then(async function () {

            if (
              currentGeneration !== generation ||
              !isNearViewport(item)
            ) return;

            const page = await pdf.getPage(item.number);

            if (currentGeneration !== generation) return;

            const original = page.getViewport({ scale: 1 });

            item.width = original.width;
            item.height = original.height;
            setPageSize(item);

            const dimensions = getDimensions(item);
            const viewport = page.getViewport({
              scale: dimensions.scale
            });

            const pixelRatio = Math.max(1, Math.min(
              window.devicePixelRatio || 1,
              2,
              Math.sqrt(6000000 /
                (viewport.width * viewport.height))
            ));

            const canvas = document.createElement("canvas");

            canvas.width = Math.max(
              1,
              Math.floor(viewport.width * pixelRatio)
            );

            canvas.height = Math.max(
              1,
              Math.floor(viewport.height * pixelRatio)
            );

            const context = canvas.getContext("2d");

            if (!context) {
              throw new Error("Canvas недоступен");
            }

            const task = page.render({
              canvasContext: context,
              viewport,
              transform: pixelRatio !== 1
                ? [pixelRatio, 0, 0, pixelRatio, 0, 0]
                : undefined
            });

            activeRender = task;

            try {
              await task.promise;
            } catch (error) {
              if (error.name === "RenderingCancelledException") {
                return;
              }
              throw error;
            } finally {
              if (activeRender === task) {
                activeRender = null;
              }
            }

            if (currentGeneration !== generation) {
              canvas.width = 0;
              canvas.height = 0;
              return;
            }

            item.element.replaceChildren(canvas);
            item.renderedGeneration = currentGeneration;
          })
          .catch(function (error) {
            if (currentGeneration === generation) {
              console.error("Ошибка страницы:", error);
              item.element.textContent =
                "Не удалось отобразить страницу " + item.number;
            }
          })
          .finally(function () {
            if (item.queuedGeneration === currentGeneration) {
              item.queuedGeneration = -1;
            }
          });
      }

      // Находим видимые страницы и обновляем счётчик
      function updateVisiblePages() {
        const area = viewer.getBoundingClientRect();
        const center = (area.top + area.bottom) / 2;

        let closest = 1;
        let bestDistance = Infinity;

        for (const item of items) {
          const rect = item.element.getBoundingClientRect();

          const distance = Math.abs(
            (rect.top + rect.bottom) / 2 - center
          );

          if (distance < bestDistance) {
            closest = item.number;
            bestDistance = distance;
          }

          if (isNearViewport(item)) {
            renderPage(item);
          } else if (
            item.renderedGeneration === generation &&
            (rect.bottom < area.top - viewer.clientHeight * 3 ||
             rect.top > area.bottom + viewer.clientHeight * 3)
          ) {
            // Освобождаем память дальних страниц
            const canvas = item.element.querySelector("canvas");

            if (canvas) {
              canvas.width = 0;
              canvas.height = 0;
              canvas.remove();
            }

            item.element.textContent = "Страница " + item.number;
            item.renderedGeneration = -1;
          }
        }

        counter.textContent =
          "Стр. " + closest + " / " + pdf.numPages;
      }

      function scheduleUpdate() {
        if (scheduled) return;

        scheduled = true;

        requestAnimationFrame(function () {
          scheduled = false;
          updateVisiblePages();
        });
      }

      // Перерасчёт размеров при масштабе или повороте экрана
      function relayout() {
        const oldMaxScroll = Math.max(
          1,
          viewer.scrollHeight - viewer.clientHeight
        );

        const position = viewer.scrollTop / oldMaxScroll;

        generation++;

        if (activeRender) {
          activeRender.cancel();
        }

        for (const item of items) {
          const canvas = item.element.querySelector("canvas");

          if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
          }

          item.element.textContent = "Страница " + item.number;
          item.renderedGeneration = -1;
          item.queuedGeneration = -1;

          setPageSize(item);
        }

        const newMaxScroll = Math.max(
          0,
          viewer.scrollHeight - viewer.clientHeight
        );

        viewer.scrollTop = position * newMaxScroll;

        updateZoomControls();
        scheduleUpdate();
      }

      zoomOut.addEventListener("click", function () {
        zoom = Math.max(0.6, Math.round((zoom - 0.2) * 10) / 10);
        relayout();
      });

      zoomIn.addEventListener("click", function () {
        zoom = Math.min(2.4, Math.round((zoom + 0.2) * 10) / 10);
        relayout();
      });

      fitButton.addEventListener("click", function () {
        zoom = 1;
        relayout();
      });

      viewer.addEventListener("scroll", scheduleUpdate, {
        passive: true
      });

      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(relayout, 180);
      });

      for (const item of items) {
        setPageSize(item);
      }

      updateZoomControls();
      scheduleUpdate();

    } catch (error) {
      message.hidden = false;
      message.textContent =
        "Не удалось загрузить PDF. Попробуйте открыть файл отдельно.";
      console.error("PDF.js:", error);
    }
  }
</script>

</body>
</html>
